services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: electives-api

    ports:
      - "5154:5154"

    depends_on:
      - postgres
      - redis

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=project_olymp_db;Username=postgres;Password=B25824DCABCB88B5;Timeout=30;"
      Redis__ConnectionString: "redis:6379,abortConnect=false"

  postgres:
    image: postgres:17

    container_name: electives-postgres

    environment:
      POSTGRES_DB: project_olymp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: B25824DCABCB88B5

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: electives-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: