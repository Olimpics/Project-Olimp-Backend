services:

  postgres:
    image: postgres:16

    container_name: electives-postgres

    environment:
      POSTGRES_DB: project_olymp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: B25824DCABCB88B5

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: electives-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: